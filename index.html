<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Swiftly. | Pavanbhagi</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0071E3">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/neo.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <style>
        :root {
            --apple-bg: #F5F5F7;
            --apple-glass: rgba(255, 255, 255, 0.75);
            --apple-border: rgba(0, 0, 0, 0.08);
            --apple-text: #1D1D1F;
            --apple-blue: #0071E3;
            --apple-green: #34C759;
            --apple-dim: #86868b;
        }

        [data-theme="dark"] {
            --apple-bg: #000000;
            --apple-glass: rgba(28, 28, 30, 0.85);
            --apple-border: rgba(255, 255, 255, 0.12);
            --apple-text: #F5F5F7;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            transition: background 0.5s ease;
        }

        #progress-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: rgba(0,0,0,0.05);
            z-index: 2001;
        }
        #progress-bar {
            width: 0%; height: 100%;
            background: var(--apple-blue);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pulse-dot {
            height: 8px; width: 8px;
            background-color: var(--apple-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(52, 199, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
        }

        .dock-wrapper {
            position: fixed;
            left: 20px; top: 120px; bottom: 40px;
            width: 70px; z-index: 1000;
        }
        .dock-container {
            background: var(--apple-glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--apple-border);
            border-radius: 22px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 100%;
            scrollbar-width: none;
        }
        .dock-icon {
            width: 44px; height: 44px; min-height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            background: rgba(0,0,0,0.03);
        }
        .dock-icon:hover { transform: scale(1.3) translateX(10px); background: var(--apple-blue); color: white; }
        .dock-icon.completed { border: 2px solid var(--apple-blue); }

        .main-content { margin-left: 160px; max-width: 800px; padding: 0 40px 100px; }

        .apple-card {
            background: var(--apple-glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--apple-border);
            border-radius: 30px;
            padding: 40px; margin-bottom: 80px;
            opacity: 0; transform: translateY(40px);
            position: relative;
        }

        .module-indicator {
            position: absolute; left: -140px;
            width: 100px; text-align: right;
            font-size: 0.7rem; font-weight: 800;
            color: var(--apple-dim);
            text-transform: uppercase; letter-spacing: 0.15em;
        }

        .editor-container { margin-top: 25px; border-radius: 20px; overflow: hidden; border: 1px solid var(--apple-border); background: #fff; }
        .CodeMirror { height: auto; font-family: "SF Mono", monospace; font-size: 14px; padding: 25px; }

        .apple-btn {
            background: var(--apple-text); color: var(--apple-bg);
            border: none; padding: 12px 28px;
            border-radius: 50px; font-weight: 600; cursor: pointer;
        }

        .terminal {
            background: #111; color: #50fa7b;
            padding: 20px; border-radius: 0 0 20px 20px;
            font-family: "SF Mono", monospace;
            display: none; font-size: 0.9rem; white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<div class="dock-wrapper">
    <nav class="dock-container" id="side-dock"></nav>
</div>

<main class="main-content">
    <header style="padding: 120px 0 80px;">
        <h1 style="font-size: 5rem; margin: 0; letter-spacing: -4px; font-weight: 800;">Code Swiftly.</h1>
        <div style="display: flex; align-items: center; margin-top: 10px;">
            <span id="pulse-indicator" style="display:none;" class="pulse-dot"></span>
            <p id="engine-status" style="color: var(--apple-dim); font-size: 1.2rem; margin:0;">Initializing System...</p>
        </div>
    </header>
    <div id="master-flow"></div>
</main>

<script>
    const pythonModules = [
        { id: 1, name: "Intro", code: "print('Welcome to Code Swiftly.')" },
        { id: 2, name: "Data", code: "name = 'Swift'\nprint(f'{name} active.')" },
        { id: 3, name: "Lists", code: "items = ['Wasm', 'GSAP']\nprint(items)" },
        { id: 4, name: "Maps", code: "d = {'status': 'learning'}\nprint(d)" },
        { id: 5, name: "Logic", code: "if True: print('Logic active')" },
        { id: 6, name: "I/O", code: "print('System stream ready')" },
        { id: 7, name: "Blueprint", code: "class Dev: pass\nprint('Class Ready')" },
        { id: 8, name: "Math", code: "import math\nprint(math.pi)" },
        { id: 9, name: "Functions", code: "def run(): return 'Success'\nprint(run())" },
        { id: 10, name: "Iterable", code: "print([x for x in range(5)])" },
        { id: 11, name: "Yields", code: "def g(): yield 1\nprint(next(g()))" },
        { id: 12, name: "Wrappers", code: "print('Decorator Ready')" },
        { id: 13, name: "Closure", code: "print('Scope secured')" },
        { id: 14, name: "Web Data", code: "import json\nprint(json.dumps({'engine': 'Wasm'}))" },
        { id: 15, name: "Lambdas", code: "f = lambda x: x*2\nprint(f(5))" },
        { id: 16, name: "Filters", code: "print(list(filter(None, [1])))" },
        { id: 17, name: "Regex", code: "import re\nprint('Regex Live')" },
        { id: 18, name: "Temporal", code: "from datetime import datetime\nprint(datetime.now())" },
        { id: 19, name: "Scraper", code: "print('Extraction ready')" },
        { id: 20, name: "System", code: "import sys\nprint(sys.version)" },
        { id: 21, name: "Networking", code: "print('Request ready')" },
        { id: 22, name: "Auth", code: "print('Security active')" },
        { id: 23, name: "POST", code: "print('Data pushed')" },
        { id: 24, name: "Resilience", code: "print('Recovery ready')" },
        { id: 25, name: "Asynchrony", code: "import asyncio\nprint('Asyncio Live')" },
        { id: 26, name: "Performance", code: "import time\nprint(f'Benchmark: {time.time()}')" }
    ];

    let pyodide;
    const editors = {};
    const completedModules = new Set();

    async function start() {
        try {
            pyodide = await loadPyodide();
            document.getElementById('engine-status').innerText = "Python 3.11 Engine (Wasm) Live";
            document.getElementById('pulse-indicator').style.display = "inline-block";
            build();
            gsap.to(".apple-card", { opacity: 1, y: 0, duration: 1.2, stagger: 0.1, ease: "power4.out" });
        } catch (e) {
            document.getElementById('engine-status').innerText = "Engine Error.";
        }
    }

    function build() {
        const dock = document.getElementById('side-dock');
        const flow = document.getElementById('master-flow');

        pythonModules.forEach(m => {
            const icon = document.createElement('div');
            icon.className = 'dock-icon';
            icon.id = `icon-${m.id}`;
            icon.innerText = m.id;
            icon.onclick = () => document.getElementById(`day-${m.id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            dock.appendChild(icon);

            const card = document.createElement('div');
            card.className = 'apple-card';
            card.id = `day-${m.id}`;
            card.innerHTML = `
                <div class="module-indicator">Day ${m.id}</div>
                <h2 style="margin:0; font-weight: 700;">${m.name}</h2>
                <div class="editor-container">
                    <textarea id="edit-${m.id}">${m.code}</textarea>
                    <div style="padding: 15px; border-top: 1px solid var(--apple-border); text-align: right;">
                        <button class="apple-btn" onclick="runCode(${m.id})">Execute</button>
                    </div>
                    <div class="terminal" id="term-${m.id}"></div>
                </div>
            `;
            flow.appendChild(card);
            editors[m.id] = CodeMirror.fromTextArea(document.getElementById(`edit-${m.id}`), { mode: "python", theme: "neo" });
        });
    }

    async function runCode(id) {
        const term = document.getElementById(`term-${id}`);
        term.style.display = "block";
        term.innerText = ">>> Running...";
        try {
            await pyodide.runPythonAsync(`import sys, io\nsys.stdout = io.StringIO()`);
            await pyodide.runPythonAsync(editors[id].getValue());
            term.innerText = pyodide.runPython("sys.stdout.getvalue()") || "Done.";
            completedModules.add(id);
            document.getElementById(`icon-${id}`).classList.add('completed');
            document.getElementById('progress-bar').style.width = (completedModules.size / 26 * 100) + "%";
        } catch (e) { term.innerText = "Error: " + e.message; }
    }

    // Day 27: PWA Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => console.log('Offline Ready')).catch(err => console.log(err));
        });
    }

    start();
</script>
</body>
</html>
