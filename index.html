<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Swiftly. | Pavanbhagi</title>
    
    <!-- PWA & SEO -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0071E3">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/neo.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <style>
        :root {
            --apple-bg: #F5F5F7;
            --apple-glass: rgba(255, 255, 255, 0.75);
            --apple-border: rgba(0, 0, 0, 0.08);
            --apple-text: #1D1D1F;
            --apple-blue: #0071E3;
            --apple-green: #34C759;
            --apple-dim: #86868b;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            scroll-behavior: smooth;
        }

        #progress-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 4px;
            background: rgba(0,0,0,0.05); z-index: 2001;
        }
        #progress-bar {
            width: 0%; height: 100%; background: var(--apple-blue);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pulse-dot {
            height: 8px; width: 8px; background-color: var(--apple-green);
            border-radius: 50%; display: inline-block; margin-right: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(52, 199, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
        }

        .dock-wrapper {
            position: fixed; left: 20px; top: 120px; bottom: 40px; width: 70px; z-index: 1000;
        }
        .dock-container {
            background: var(--apple-glass); backdrop-filter: blur(30px);
            border: 1px solid var(--apple-border); border-radius: 22px;
            padding: 10px; display: flex; flex-direction: column; gap: 12px;
            overflow-y: auto; max-height: 100%; scrollbar-width: none;
        }
        .dock-icon {
            width: 44px; height: 44px; min-height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; cursor: pointer; transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            background: rgba(0,0,0,0.03); color: var(--apple-text);
        }
        .dock-icon:hover { transform: scale(1.3) translateX(10px); background: var(--apple-blue); color: white; }
        .dock-icon.completed { border: 2px solid var(--apple-blue); box-shadow: 0 4px 12px rgba(0,113,227,0.2); }

        .main-content { margin-left: 160px; max-width: 800px; padding: 0 40px 100px; }

        .apple-card {
            background: white; border: 1px solid var(--apple-border); border-radius: 30px;
            padding: 40px; margin-bottom: 80px; opacity: 0; transform: translateY(40px);
            position: relative;
        }

        .module-indicator {
            position: absolute; left: -140px; width: 100px; text-align: right;
            font-size: 0.7rem; font-weight: 800; color: var(--apple-dim);
            text-transform: uppercase; letter-spacing: 0.15em;
        }

        .editor-container { margin-top: 25px; border-radius: 20px; overflow: hidden; border: 1px solid var(--apple-border); }
        .CodeMirror { height: auto; font-family: "SF Mono", monospace; font-size: 14px; padding: 20px; }

        .apple-btn {
            background: var(--apple-text); color: white; border: none;
            padding: 12px 28px; border-radius: 50px; font-weight: 600; cursor: pointer;
            transition: 0.3s ease;
        }
        .apple-btn:hover { transform: scale(1.05); }

        .terminal {
            background: #111; color: #50fa7b; padding: 20px; border-radius: 0 0 20px 20px;
            font-family: "SF Mono", monospace; display: none; font-size: 0.9rem; white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<div class="dock-wrapper">
    <nav class="dock-container" id="side-dock"></nav>
</div>

<main class="main-content">
    <header style="padding: 120px 0 80px;">
        <h1 style="font-size: 5rem; margin: 0; letter-spacing: -4px; font-weight: 800;">Code Swiftly.</h1>
        <div style="display: flex; align-items: center; margin-top: 10px;">
            <span id="pulse-indicator" style="display:none;" class="pulse-dot"></span>
            <p id="engine-status" style="color: var(--apple-dim); font-size: 1.2rem; margin:0;">Initializing Engine...</p>
        </div>
    </header>
    <div id="master-flow"></div>
</main>

<script>
    const pythonModules = [
        // Days 1 to 26 (Your original established series)
        { id: 1, name: "Introduction", code: "print('Welcome to Code Swiftly.')\nprint('Python is running natively in your browser.')" },
        { id: 2, name: "Variable Logic", code: "name = 'Swift'\nversion = 3.0\nprint(f'{name} v{version} active.')" },
        { id: 3, name: "List Architectures", code: "stack = ['Wasm', 'GSAP', 'CodeMirror']\nstack.append('PWA')\nprint(f'Project Stack: {stack}')" },
        { id: 4, name: "Dictionary Mapping", code: "metadata = {'day': 4, 'status': 'Stable'}\nprint(f'System Status: {metadata}')" },
        { id: 5, name: "Control Flow", code: "try:\n    print(10/0)\nexcept ZeroDivisionError:\n    print('Error caught locally.')" },
        { id: 6, name: "File Streams", code: "print('Simulating Virtual File Access...')\nprint('Buffer secured.')" },
        { id: 7, name: "Object Blueprints", code: "class IDE:\n    def __init__(self): self.type = 'Serverless'\nprint(IDE().type)" },
        { id: 8, name: "Math Engine", code: "import math\nprint(f'PI Calculation: {math.pi}')" },
        { id: 9, name: "Functions", code: "def run(): return 'Success'\nprint(run())" },
        { id: 10, name: "List Comprehension", code: "print([x*x for x in range(5)])" },
        { id: 11, name: "Iterators", code: "def g():\n    yield 'Step 1'\n    yield 'Step 2'\nprint(next(g()))" },
        { id: 12, name: "Decorators", code: "def wrap(f): return lambda: f'[{f()}]'\n@wrap\ndef app(): return 'Swift'\nprint(app())" },
        { id: 13, name: "Closure Scopes", code: "def outer(n): return lambda: n + 1\nprint(outer(26)())" },
        { id: 14, name: "JSON Parsing", code: "import json\nprint(json.dumps({'engine': 'Wasm'}))" },
        { id: 15, name: "Lambda Functions", code: "f = lambda x: x**2\nprint(f(8))" },
        { id: 16, name: "Filter Logic", code: "nums = [1, 2, 3, 4, 5]\nprint(list(filter(lambda x: x > 3, nums)))" },
        { id: 17, name: "Regex Patterns", code: "import re\nprint(re.search('Swift', 'Code Swiftly').group())" },
        { id: 18, name: "Datetime API", code: "from datetime import datetime\nprint(datetime.now())" },
        { id: 19, name: "Web Simulation", code: "print('Extraction live...')\nprint('Status: 200 OK')" },
        { id: 20, name: "System Version", code: "import sys\nprint(sys.version)" },
        { id: 21, name: "Net Simulation", code: "print('GET Request Ready.')" },
        { id: 22, name: "Auth Tokens", code: "print('Bearer Token active.')" },
        { id: 23, name: "POST Protocols", code: "print('Data Transmitted.')" },
        { id: 24, name: "Error Resilience", code: "print('Recovery logic ready.')" },
        { id: 25, name: "Asyncio", code: "import asyncio\nasync def fetch():\n    print('Async task started...')\n    await asyncio.sleep(0.5)\n    print('Finished.')\nawait fetch()" },
        { id: 26, name: "Performance", code: "import time\nstart = time.time()\n_ = [x for x in range(10000)]\nprint(f'Execution Time: {time.time()-start:.6f}s')" },
        
        // Days 27-30 (The New Continuation)
        { id: 27, name: "Agentic Reasoning", code: "# Simulating a 'Thought-Action' Loop\ndef agent_think(task):\n    print(f'Thought: How to solve {task}?')\n    return 'Action: Query local database'\n\nprint(agent_think('Optimize Python Code'))" },
        { id: 28, name: "Vector Scoring (RAG)", code: "# Simple Semantic Match Logic\ndef similarity(a, b):\n    matches = set(a.split()) & set(b.split())\n    return len(matches) / max(len(a.split()), 1)\n\nprint(f'Match Score: {similarity(\"AI Python\", \"Python for AI\")}')" },
        { id: 29, name: "Prompt Templates", code: "# Formatting AI Instructions\ndef create_prompt(inp):\n    return f'### INSTRUCTION ###\\nSolve: {inp}\\n### OUTPUT ###'\n\nprint(create_prompt('Reverse string \"Swift\"'))" },
        { id: 30, name: "AI Safety Guardrails", code: "# Security check for AI outputs\nblocked = ['os.system', 'eval', 'subprocess']\ndef check(code):\n    return 'Safe' if not any(b in code for b in blocked) else 'Malicious'\n\nprint(f'Status: {check(\"print(1+1)\")}')" },
        { id: 31, name: "AI Memory Systems", code: "# Day 31: Contextual Memory Buffer\nclass AIMemory:\n    def __init__(self):\n        self.history = []\n\n    def add_context(self, user, bot):\n        self.history.append({'user': user, 'bot': bot})\n\n    def get_context(self):\n        return f'Memory: {self.history[-1:] if self.history else \"Empty\"}'\n\nmem = AIMemory()\nmem.add_context('Hi', 'Hello!')\nprint(mem.get_context())\nprint('Memory persistence active.')" },
        { id: 32, name: "AI Response Streaming", code: "# Day 32: Simulating Token Streaming\nimport time\n\ndef stream_response(text):\n    print('AI Typing...')\n    for char in text:\n        # Simulating the 'typing' effect\n        # In a real app, this would update the UI state\n        print(char, end='', flush=True)\n        time.sleep(0.05)\n    print('\\nStream Complete.')\n\nresponse = 'The quick brown fox jumps over the lazy dog.'\nstream_response(response)" },
        { id: 33, name: "Parallel Agent Logic", code: "# Day 33: Concurrent Task Simulation\nimport asyncio\n\nasync def task_one():\n    print('Agent Thought A: Searching Web...')\n    await asyncio.sleep(0.8)\n    print('Web Search Complete.')\n\nasync def task_two():\n    print('Agent Thought B: Querying Database...')\n    await asyncio.sleep(0.4)\n    print('Database Query Complete.')\n\nasync def run_parallel():\n    print('Starting Parallel Operations...')\n    await asyncio.gather(task_one(), task_two())\n    print('All concurrent thoughts processed.')\n\nimport pyodide_js\nawait run_parallel()" }
    ];

    let pyodide;
    const editors = {};
    const completedModules = new Set();

    async function start() {
        try {
            pyodide = await loadPyodide();
            document.getElementById('engine-status').innerText = "Python 3.11 Engine (Wasm) Live";
            document.getElementById('pulse-indicator').style.display = "inline-block";
            build();
            gsap.to(".apple-card", { opacity: 1, y: 0, duration: 1.2, stagger: 0.1, ease: "power4.out" });
        } catch (e) { document.getElementById('engine-status').innerText = "Engine Load Failed."; }
    }

    function build() {
        const dock = document.getElementById('side-dock');
        const flow = document.getElementById('master-flow');

        pythonModules.forEach(m => {
            const icon = document.createElement('div');
            icon.className = 'dock-icon';
            icon.id = `icon-${m.id}`;
            icon.innerText = m.id;
            icon.onclick = () => document.getElementById(`day-${m.id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            dock.appendChild(icon);

            const card = document.createElement('div');
            card.className = 'apple-card';
            card.id = `day-${m.id}`;
            card.innerHTML = `
                <div class="module-indicator">Day ${m.id}</div>
                <h2 style="margin:0; font-weight: 700;">${m.name}</h2>
                <div class="editor-container">
                    <textarea id="edit-${m.id}">${m.code}</textarea>
                    <div style="padding: 15px; border-top: 1px solid var(--apple-border); text-align: right;">
                        <button class="apple-btn" onclick="runCode(${m.id})">Execute</button>
                    </div>
                    <div class="terminal" id="term-${m.id}"></div>
                </div>
            `;
            flow.appendChild(card);
            editors[m.id] = CodeMirror.fromTextArea(document.getElementById(`edit-${m.id}`), {
                mode: "python", theme: "neo", lineNumbers: false, autoCloseBrackets: true
            });
        });
    }

    async function runCode(id) {
        const term = document.getElementById(`term-${id}`);
        term.style.display = "block";
        term.innerText = ">>> Initializing Execution...";
        try {
            await pyodide.runPythonAsync(`import sys, io\nsys.stdout = io.StringIO()`);
            await pyodide.runPythonAsync(editors[id].getValue());
            const output = pyodide.runPython("sys.stdout.getvalue()");
            term.innerText = output || "Execution complete.";
            completedModules.add(id);
            document.getElementById(`icon-${id}`).classList.add('completed');
            document.getElementById('progress-bar').style.width = (completedModules.size / 30 * 100) + "%";
        } catch (e) { term.innerText = "Runtime Error: " + e.message; }
    }

    // Service Worker for Day 27+ Offline PWA support
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        });
    }

    start();
</script>
</body>
</html>
