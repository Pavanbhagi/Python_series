<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Swiftly. | Pavanbhagi</title>
    
    <!-- PWA & SEO -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0071E3">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/neo.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <style>
        :root {
            --apple-bg: #F5F5F7;
            --apple-glass: rgba(255, 255, 255, 0.75);
            --apple-border: rgba(0, 0, 0, 0.08);
            --apple-text: #1D1D1F;
            --apple-blue: #0071E3;
            --apple-green: #34C759;
            --apple-dim: #86868b;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        #progress-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 4px;
            background: rgba(0,0,0,0.05); z-index: 2001;
        }
        #progress-bar {
            width: 0%; height: 100%; background: var(--apple-blue);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dock-wrapper {
            position: fixed; left: 20px; top: 120px; bottom: 40px; width: 70px; z-index: 1000;
        }
        .dock-container {
            background: var(--apple-glass); backdrop-filter: blur(30px);
            border: 1px solid var(--apple-border); border-radius: 22px;
            padding: 10px; display: flex; flex-direction: column; gap: 12px;
            overflow-y: auto; max-height: 100%; scrollbar-width: none;
        }
        .dock-icon {
            width: 44px; height: 44px; min-height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; cursor: pointer; transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            background: rgba(0,0,0,0.03); color: var(--apple-text);
        }
        .dock-icon:hover { transform: scale(1.2) translateX(5px); background: var(--apple-blue); color: white; }
        .dock-icon.completed { border: 2px solid var(--apple-blue); background: white; }

        .main-content { margin-left: 140px; max-width: 900px; padding: 0 40px 100px; }

        .apple-card {
            background: white; border: 1px solid var(--apple-border); border-radius: 24px;
            padding: 30px; margin-bottom: 60px; opacity: 0; transform: translateY(30px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.02);
        }

        .editor-container { margin-top: 20px; border-radius: 16px; overflow: hidden; border: 1px solid var(--apple-border); }
        .CodeMirror { height: auto; font-family: "SF Mono", "Fira Code", monospace; font-size: 14px; padding: 15px; }

        .apple-btn {
            background: var(--apple-blue); color: white; border: none;
            padding: 10px 24px; border-radius: 50px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }
        .apple-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .terminal {
            background: #1c1c1e; color: #34C759; padding: 20px; border-radius: 0 0 16px 16px;
            font-family: "SF Mono", monospace; display: none; font-size: 0.85rem; line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<div class="dock-wrapper">
    <nav class="dock-container" id="side-dock"></nav>
</div>

<main class="main-content">
    <header style="padding: 100px 0 60px;">
        <h1 style="font-size: 4rem; margin: 0; letter-spacing: -3px; font-weight: 800;">Code Swiftly.</h1>
        <p id="engine-status" style="color: var(--apple-dim); font-size: 1.1rem; margin-top: 10px;">Initializing Python Engine...</p>
    </header>
    <div id="master-flow"></div>
</main>

<script>
    const pythonModules = [
        // Days 1-26: Fundamentals & Established Projects
        { id: 1, name: "Introduction", code: "print('Welcome to Code Swiftly.')\nprint('Python is running natively in your browser.')" },
        { id: 2, name: "Variable Logic", code: "name = 'Swift'\nversion = 3.0\nprint(f'{name} v{version} active.')" },
        { id: 3, name: "List Architectures", code: "stack = ['Wasm', 'GSAP', 'CodeMirror']\nstack.append('PWA')\nprint(f'Project Stack: {stack}')" },
        { id: 4, name: "Dictionary Mapping", code: "metadata = {'day': 4, 'status': 'Stable'}\nprint(f'System Status: {metadata}')" },
        { id: 5, name: "Control Flow", code: "try:\n    print(10/0)\nexcept ZeroDivisionError:\n    print('Error caught locally.')" },
        { id: 6, name: "File Streams", code: "print('Simulating Virtual File Access...')\nprint('Buffer secured.')" },
        { id: 7, name: "Object Blueprints", code: "class IDE:\n    def __init__(self): self.type = 'Serverless'\nprint(IDE().type)" },
        { id: 8, name: "Math Engine", code: "import math\nprint(f'PI Calculation: {math.pi}')" },
        { id: 9, name: "Functions", code: "def run(): return 'Success'\nprint(run())" },
        { id: 10, name: "List Comprehension", code: "print([x*x for x in range(5)])" },
        { id: 11, name: "Iterators", code: "def g():\n    yield 'Step 1'\n    yield 'Step 2'\nprint(next(g()))" },
        { id: 12, name: "Decorators", code: "def wrap(f): return lambda: f'[{f()}]'\n@wrap\ndef app(): return 'Swift'\nprint(app())" },
        { id: 13, name: "Closure Scopes", code: "def outer(n): return lambda: n + 1\nprint(outer(26)())" },
        { id: 14, name: "JSON Parsing", code: "import json\nprint(json.dumps({'engine': 'Wasm'}))" },
        { id: 15, name: "Lambda Functions", code: "f = lambda x: x**2\nprint(f(8))" },
        { id: 16, name: "Filter Logic", code: "nums = [1, 2, 3, 4, 5]\nprint(list(filter(lambda x: x > 3, nums)))" },
        { id: 17, name: "Regex Patterns", code: "import re\nprint(re.search('Swift', 'Code Swiftly').group())" },
        { id: 18, name: "Datetime API", code: "from datetime import datetime\nprint(datetime.now())" },
        { id: 19, name: "Web Simulation", code: "print('Extraction live...')\nprint('Status: 200 OK')" },
        { id: 20, name: "System Version", code: "import sys\nprint(sys.version)" },
        { id: 21, name: "Net Simulation", code: "print('GET Request Ready.')" },
        { id: 22, name: "Auth Tokens", code: "print('Bearer Token active.')" },
        { id: 23, name: "POST Protocols", code: "print('Data Transmitted.')" },
        { id: 24, name: "Error Resilience", code: "print('Recovery logic ready.')" },
        { id: 25, name: "Asyncio", code: "import asyncio\nasync def fetch():\n    await asyncio.sleep(0.5)\n    print('Async task finished.')\nawait fetch()" },
        { id: 26, name: "Performance", code: "import time\nstart = time.time()\n_ = [x for x in range(10000)]\nprint(f'Execution Time: {time.time()-start:.6f}s')" },
        
        // Days 27-33: AI & Agentic Reasoning (New)
        { id: 27, name: "Agentic Reasoning", code: "# Day 27: AI Thought Loop\ndef agent_reason(task):\n    print(f'Task: {task}')\n    return 'Decision: Use WebSearch Tool'\nprint(agent_reason('Weather in Hyderabad'))" },
        { id: 28, name: "Vector Scoring", code: "# Day 28: Simple Semantic Matching\ndef get_score(query, doc):\n    common = set(query.split()) & set(doc.split())\n    return len(common) / len(query.split())\nprint(f'Match Score: {get_score(\"Python AI\", \"Python is for AI\")}')" },
        { id: 29, name: "Prompt Templates", code: "# Day 29: Dynamic Prompting\ndef format_prompt(inp, role='Expert'):\n    return f'Role: {role}\\nSolve: {inp}'\nprint(format_prompt('Write a function'))" },
        { id: 30, name: "AI Guardrails", code: "# Day 30: Safety Checks\nblocked = ['import os', 'eval']\ndef is_safe(code):\n    return not any(w in code for w in blocked)\nprint(f'Safe? {is_safe(\"print(1)\")}')" },
        { id: 31, name: "AI Memory", code: "# Day 31: Context Buffer\nclass Memory:\n    def __init__(self): self.hist = []\n    def add((u, b)): self.hist.append({'u':u, 'b':b})\nmem = Memory()\nprint('Context system ready.')" },
        { id: 32, name: "Response Streaming", code: "# Day 32: Token Simulation\nimport time\ndef stream(t):\n    for c in t:\n        print(c, end='', flush=True)\n        time.sleep(0.02)\nstream('Streaming active...')" },
        { id: 33, name: "Parallel Agent Logic", code: "# Day 33: Concurrency\nimport asyncio\nasync def t1():\n    print('Task A started...')\n    await asyncio.sleep(0.5)\nawait t1()" }
    ];

    let pyodide;
    const editors = {};
    const completedModules = new Set();

    async function init() {
        try {
            pyodide = await loadPyodide();
            document.getElementById('engine-status').innerText = "Python 3.11 Wasm Engine Ready";
            document.getElementById('engine-status').style.color = "var(--apple-green)";
            render();
            gsap.to(".apple-card", { opacity: 1, y: 0, duration: 0.8, stagger: 0.05 });
        } catch (e) { document.getElementById('engine-status').innerText = "Engine Load Failed."; }
    }

    function render() {
        const dock = document.getElementById('side-dock');
        const flow = document.getElementById('master-flow');

        pythonModules.forEach(m => {
            // Dock Icon
            const icon = document.createElement('div');
            icon.className = 'dock-icon';
            icon.id = `icon-${m.id}`;
            icon.innerText = m.id;
            icon.onclick = () => document.getElementById(`day-${m.id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            dock.appendChild(icon);

            // Card
            const card = document.createElement('div');
            card.className = 'apple-card';
            card.id = `day-${m.id}`;
            card.innerHTML = `
                <h2 style="margin:0; font-size: 1.5rem;">Day ${m.id}: ${m.name}</h2>
                <div class="editor-container">
                    <textarea id="edit-${m.id}">${m.code}</textarea>
                    <div style="padding: 12px; background: #fbfbfd; border-top: 1px solid var(--apple-border); text-align: right;">
                        <button class="apple-btn" onclick="runCode(${m.id})">Run Code</button>
                    </div>
                    <div class="terminal" id="term-${m.id}"></div>
                </div>
            `;
            flow.appendChild(card);
            editors[m.id] = CodeMirror.fromTextArea(document.getElementById(`edit-${m.id}`), {
                mode: "python", theme: "neo", lineNumbers: true, indentUnit: 4
            });
        });
    }

    async function runCode(id) {
        const term = document.getElementById(`term-${id}`);
        term.style.display = "block";
        term.innerText = "Running...";
        try {
            await pyodide.runPythonAsync(`import sys, io\nsys.stdout = io.StringIO()`);
            await pyodide.runPythonAsync(editors[id].getValue());
            const output = pyodide.runPython("sys.stdout.getvalue()");
            term.innerText = output || "Process finished with no output.";
            
            completedModules.add(id);
            document.getElementById(`icon-${id}`).classList.add('completed');
            document.getElementById('progress-bar').style.width = (completedModules.size / 33 * 100) + "%";
        } catch (e) { term.innerText = "Error: " + e.message; }
    }

    init();
</script>
</body>
</html>
